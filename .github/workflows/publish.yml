name: Publish to RubyGems

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - name: Version from release tag
        if: github.event_name == 'release'
        run: sed -i "s/VERSION = \".*\"/VERSION = \"${GITHUB_REF_NAME#v}\"/" lib/smtping/version.rb

      - name: Smoke test
        run: ruby -Ilib -e 'require "smtping-email-verifier"; puts Smtping::VERSION; abort "band" unless Smtping.band("valid") == "safe"'

      - name: Build
        run: gem build smtping-email-verifier.gemspec

      - name: RubyGems login (Trusted Publishing)
        uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Push
        run: gem push smtping-email-verifier-*.gem
