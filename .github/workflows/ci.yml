name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['2.7', '3.1', '3.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Minitest
        run: gem list -i minitest || gem install minitest -v '< 5.16'
      - name: Tests
        run: ruby -w -Ilib test/test_smtping.rb
      - name: Build (not pushed)
        run: gem build smtping-email-verifier.gemspec
